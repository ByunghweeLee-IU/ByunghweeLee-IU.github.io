<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive demo · Byunghwee Lee</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #213547; background: #f5f7fa; }
    body { max-width: 640px; margin: 10vh auto; padding: 24px; }
    main { background: white; border: 1px solid #dde3eb; border-radius: 20px; padding: clamp(24px, 6vw, 48px); }
    a { color: #315dd5; } h1 { font-size: clamp(28px, 5vw, 40px); }
    p { line-height: 1.8; } label { display: block; margin-top: 32px; }
    input { width: 100%; margin: 20px 0; accent-color: #315dd5; }
    progress { width: 100%; height: 24px; accent-color: #315dd5; }
    output { color: #315dd5; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <a href="/research/">← Research</a>
    <h1>Interactive demo</h1>
    <p>슬라이더를 움직여 값을 바꿔보세요. HTML, CSS, JavaScript로 만든 간단한 인터랙티브 예시입니다.</p>
    <label for="value">현재 값: <output id="result" for="value">50</output>%</label>
    <input id="value" type="range" min="0" max="100" value="50">
    <progress id="bar" max="100" value="50" aria-label="선택한 값">50%</progress>
  </main>
  <script>
    const slider = document.getElementById('value');
    slider.addEventListener('input', () => {
      document.getElementById('result').value = slider.value;
      document.getElementById('bar').value = slider.value;
      document.getElementById('bar').textContent = `${slider.value}%`;
    });
  </script>
</body>
</html>
